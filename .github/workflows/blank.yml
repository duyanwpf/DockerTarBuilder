name: Download GDAL from GISInternals
on:
  push:
    branches: [ "main" ]   # 仅当推送到 main 分支时触发
jobs:
  download-and-extract:
    runs-on: ubuntu-latest  # 使用 GitHub 托管的最新版 Ubuntu 运行器
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download GDAL Stable Release
        run: |
          curl -L --fail --retry 3 --retry-delay 5 \
            -o gdal.zip \
            "http://archive.gisinternals.com/query.html?content=filelist&file=release-1944-x64-gdal-3-12-1-mapserver-8-6-0.zip"
      
      - name: Verify download and list files
        run: |
          ls -lh gdal.zip
          file gdal.zip
